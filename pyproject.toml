[project]
name = "video-agent-bench"
version = "0.1.0"
description = "Two upstream-frozen video-agent benchmark workloads under a unified Docker image and OpenClaw."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
