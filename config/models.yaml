# Model configuration for video_agent_bench
# These are the models that foundation skills and verifiers expect.
# Keys are read by skill scripts via environment variables.

models:
  # VideoWeaver foundation skills
  image_gen:
    provider: seedream
    env_key: ARK_API_KEY
    note: "VideoWeaver skills/image-gen uses Volcengine ARK API"

  video_gen:
    provider: seedance
    env_key: ARK_API_KEY
    note: "VideoWeaver skills/video-gen uses Volcengine ARK API"

  vision_understanding:
    provider: volcengine_vlm
    env_key: ARK_API_KEY

  asr:
    provider: whisper_local
    note: "ASR uses local Whisper model (pre-cached in Docker). No API key needed."

  asr_volcengine:
    provider: volcengine_asr
    env_keys: [ASR_APPID, ASR_TOKEN]
    note: "VideoWeaver skills/automatic-speech-recognition uses Volcengine ASR (requires ASR_APPID + ASR_TOKEN)"

  tts:
    provider: volcengine_tts
    env_keys: [VOLCENGINE_TTS_APPID, VOLCENGINE_TTS_TOKEN]
    note: "VideoWeaver skills/text-to-speech uses Volcengine TTS"

  # AgenticVBench repurpose verifier
  verifier_judge_content:
    provider: anthropic
    env_key: ANTHROPIC_API_KEY
    note: "Used by AgenticVBench judge.py for rubric-based content judging"

  verifier_judge_audio_video:
    provider: gemini
    env_key: GEMINI_API_KEY
    note: "Used by AgenticVBench judge.py for audio/video grading"
